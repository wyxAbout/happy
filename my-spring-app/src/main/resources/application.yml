server:
  port: 5022

# 数据库配置
spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/12happy?useUnicode=true&characterEncoding=utf8&allowMultiQueries=false&serverTimezone=GMT%2b8&allowPublicKeyRetrieval=true
    username: root
    password:

#配置mybatis实体和xml映射
mybatis:
  mapper-locations: classpath:mapper/*.xml
  configuration:
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
    map-underscore-to-camel-case: true

# OpenAPI 集成配置（Shimmer Shop 精简 AWSv4 签名认证）
openapi:
  base-url: https://go.neusoft.edu.cn
  base-path: /api/open/v1
  login-path: /auth/login
  server-name: go.neusoft.edu.cn
  auth:
    app-id: ${OPENAPI_APP_ID:}
    api-key: ${OPENAPI_API_KEY:}
